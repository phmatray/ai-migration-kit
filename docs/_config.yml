# docs/ is the GitHub Pages site (source: main / /docs), built by Pages' native Jekyll with the
# just-the-docs remote theme — sidebar, search and mermaid without a build step (#401).
title: AI Migration Kit
description: A Claude Code plugin — a gate-verified methodology for legacy .NET migrations and a hands-off GitHub issue → PR lifecycle.
remote_theme: just-the-docs/just-the-docs
url: https://phmatray.github.io
baseurl: /ai-migration-kit

search_enabled: true
heading_anchors: true
# The site's own scheme — docs/_sass/color_schemes/kit.scss; its type and measure are in
# docs/_sass/custom/setup.scss, the rest in docs/_sass/custom/custom.scss.
color_scheme: kit

# The ```mermaid fences the guide and ARCHITECTURE.md already use render through the theme's
# built-in mermaid support; the version is pinned so a theme update cannot change the diagrams.
mermaid:
  version: "10.9.0"

aux_links:
  Repository: https://github.com/phmatray/ai-migration-kit
aux_links_new_tab: true

# What must not become a page: the superpowers specs/plans (working documents), the case-study
# inventories (JSON) and captures (PNG), the generated dashboard (HTML that stands on its own),
# and the kit backlog — a development document review-followups reads at run time
# (scripts/release-title-gate.sh's SHIPPED_ANYWAY), so it carries no site front matter.
#
# By PATH, never a bare glob: `"*.html"` here excluded the remote theme's own layouts — Jekyll 3's
# entry filter fnmatches without FNM_PATHNAME and the layout reader runs through it — so every
# page was published without a layout (measured 2026-09-02, the site's first build). The Pages
# guard in tests/skills/test.sh refuses a glob entry for that reason.
exclude:
  - superpowers/
  - backlog.md
  - case-studies/winrt-portfolio/inventory/
  - case-studies/winrt-portfolio/captures/
  - case-studies/winrt-portfolio/dashboard.html
  - Gemfile
  - Gemfile.lock

# Every page names its own title and nav_order in its front matter; a page without one drops out
# of the sidebar silently, which is why tests/skills/test.sh refuses an untitled docs/ page.
defaults:
  - scope:
      path: ""
    values:
      layout: default
