name: release-title

# The release-title gate, in a workflow of its own (#57).
#
# It lived in `ci.yml`, as one step of the `kit` job — the job that carries the dotnet build and
# every golden suite. (No step count here on purpose: `kit` grows most months, and this repo has
# already learned that a hand-maintained inventory of it goes stale — scripts/ci-wiring-check.py
# exists because the README's went stale four times. Ask the file, not this comment.)
#
# The gate reads the PR *title*, so a retitle has to re-run it, which meant `ci.yml` carried
# `types: [… edited]`. But `types` is WORKFLOW-level and `edited` fires on title, **body** or
# base-branch changes with nothing in the payload trigger to tell them apart — so every PR body
# edit ran that whole job to re-decide a ~50 ms bash check against a title that had not changed.
# That is this repo's normal workflow, not a corner case: skills/implement-issue ticks the PR's
# `### Plan` mirror with `gh pr edit --body-file` once per task, so a ten-task issue fired ten
# extra full runs.
#
# Splitting is what fixes it, rather than a condition on the heavy job. Skipping `kit` on body-only
# edits would work — GitHub sends `changes.title` only when the title changed — but it makes the one
# real build check report `skipped`, and this repo has recorded twice that a wall of skipped checks
# reads like a green (merge-pr has a whole table on telling phantom skips apart). One job, one honest
# verdict; the trigger each job needs is now the trigger each job has.
#
# TWO THINGS THE SPLIT COSTS, written down because neither is obvious from the diff:
#
#  1. **The gate no longer short-circuits the build.** As step 2 of `kit` it failed in ~30 s, before
#     setup-dotnet, and the rest of the job never ran. Now the two are independent: a PR titled
#     `chore(skills):` that touches skills/** runs `kit` to completion (green) while this workflow
#     reports red beside it. The verdict is unchanged and still blocking-by-inspection; what is lost
#     is the early exit. Judged worth it — that path costs runner time only on a PR that is already
#     failing, whereas the body-edit path it replaces cost it on PRs that were fine.
#  2. **A per-push cost, not a one-off.** "One extra checkout" undersells it: this workflow allocates
#     its own runner and does a `fetch-depth: 0` clone on every `synchronize` too, not only on the
#     edits the split was meant to make cheap. Net for a ten-task issue: 10 heavy `ci` runs + ~20
#     cheap gate runs, against 20 heavy runs before. Favourable, but not free.
#
# Observed on the PR that introduced this file (#119) on 2026-08-13, against head sha fafdca5 — a
# point-in-time record, since no test can assert a trigger and Actions logs are pruned after 90 days:
#
#   push (synchronize)   ci ✅ 31711285103   release-title ✅ 31711285233
#   PR *body* edit       ci — not triggered  release-title ✅ 31711515732
#   PR *title* edit      ci — not triggered  release-title ✅ 31711605496
#
# `ci` ran exactly once for that sha, from the push; the two edits added no run to it. The title
# edit's gate log echoed the NEW title in its env block, so it re-judged rather than replaying the
# earlier verdict. That is the whole behaviour this split exists to produce.

on:
  # `edited` is load-bearing HERE, and only here: this is the workflow that reads the title, so a
  # retitle must re-judge it — otherwise a PR could go green as `fix(skills):` and be tidied to
  # `chore(skills):` before the merge. Naming any type replaces the defaults, so
  # opened/synchronize/reopened are listed explicitly rather than inherited.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Nothing here writes: the gate takes the title and the shas as arguments and reports through its
# exit status. Declared explicitly so a change to the repository's default workflow permissions
# cannot silently widen it — and so it stays obvious that fork PRs can run this (no secrets).
permissions:
  contents: read

# Without a group, a retitle starts a second run against the *same* head sha while the first is
# still going, and both publish this check — which verdict the PR settles on then depends on run
# ordering rather than on the title that is actually there. That would defeat the reason `edited`
# is in the trigger at all. Cancel the superseded run so the latest title decides.
#
# No `|| github.ref` fallback and no conditional cancel, unlike ci.yml: `pull_request` is the only
# trigger, so `github.event.pull_request.number` is always present and every run here is a PR run.
# A fallback that can never fire is the same dead branch as the `if:` removed from the step below.
concurrency:
  group: release-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # `title-gate`, not `gate`. The job name IS the check-run name and the key any future branch
  # protection rule would match on, and it cannot be changed afterwards without breaking that rule.
  # This repo calls at least three other things "the gate" (worktrees-ignored.sh, ci-wiring-check.py,
  # the Renovate validator step), so a bare `gate` would be ambiguous at exactly the moment someone
  # has to type it into a settings page.
  #
  # ⚠️ IF BRANCH PROTECTION IS EVER ENABLED ON `main`, IT MUST REQUIRE BOTH `kit` AND `title-gate`.
  # Before #57 there was one check and requiring it covered everything. There are two now, and this
  # is the half that is easy to forget — requiring only `kit` would let a PR titled `chore(skills):`
  # merge green while this workflow sits red and unrequired, which is exactly the hole #27 opened
  # this gate to close. `main` has no protection today, so nothing is broken; this is the note for
  # whoever adds it.
  title-gate:
    runs-on: ubuntu-latest
    # `release-please.yml` sets one for the same reason: an un-timed job that hangs holds an
    # `in_progress` check-run for GitHub's 6-hour default, and skills/merge-pr treats in_progress as
    # "CI still pending" and waits on it. Two steps against a fixed-size repo; ten minutes is
    # already generous, and a run that exceeds it is stuck rather than slow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # NOT optional. release-title-diff.sh resolves the merge base of the PR's base and head
          # shas, and fails closed when either is missing from the clone — correctly, since an
          # empty change set would silently skip the gate. A shallow default checkout reintroduces
          # exactly that "sha not present" path.
          fetch-depth: 0

      # Consumers install a version-keyed cache of this plugin (#6), so a skills change reaches
      # nobody until release-please cuts a release — and this repo squash-merges, so the PR title
      # is the commit release-please will read on main. #7 enforced that with a per-PR version
      # bump; #14 rightly retired it when release-please landed, leaving the guarantee resting on
      # an unchecked precondition (#27). This step is that check.
      #
      # `if: github.event_name == 'pull_request'` guarded this step in ci.yml, which also runs on
      # push to main. This workflow has no push trigger, so that condition is always true here —
      # and a tautological `if:` on the only step of the only job is precisely the shape that
      # produces a check-run nobody can distinguish from a deliberate skip. Dropped, not moved.
      - name: Skills changes carry a releasable PR title
        env:
          # Never interpolate ${{ … }} into a run: block — a PR title is attacker-controlled on
          # fork PRs and would be pasted into the script the shell parses. Through the environment
          # it stays data, and the step needs no secrets, so forks can run it.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The path list comes from a script with its own golden test, not from inline yaml.
          # Inline, `mapfile -t x < <(git diff …)` swallowed git's exit status, so a missing sha
          # produced an empty array that the next line read as "nothing to gate" — the gate
          # skipped itself and CI stayed green. Here the exit status is the only thing that
          # separates "no files changed" from "could not tell", and it is checked.
          if ! ./scripts/release-title-diff.sh "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.z"; then
            echo "could not determine the changed paths — failing rather than skipping the gate"
            exit 1
          fi
          mapfile -d '' -t changed < "$RUNNER_TEMP/changed.z"
          # Authoritative now: the script exited 0, so an empty list really is an empty diff —
          # e.g. the scaffold-only commit of a freshly opened draft PR.
          if [ ${#changed[@]} -eq 0 ]; then
            echo "empty diff against the merge base — nothing to gate."; exit 0
          fi
          ./scripts/release-title-gate.sh "$PR_TITLE" "${changed[@]}"
