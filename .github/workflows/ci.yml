name: ci

on:
  push:
    branches: [main]
  # No `types:` here — the default set (opened, synchronize, reopened) is exactly what this job
  # reacts to. It once listed `edited` as well, for the release-title gate that used to be a step
  # below; `types` is WORKFLOW-level, so that made every PR *body* edit run all of the following —
  # the dotnet build and every golden suite — to re-decide a ~50 ms check on a title that had not
  # changed. The gate moved to .github/workflows/release-title.yml, which keeps `edited` where it
  # is actually load-bearing (#57); the reasoning for the split lives in that file's header.
  #
  # Note what going back to the defaults also gives up: `edited` covers title, body AND base-branch
  # changes indistinguishably, so retargeting a PR to a different base no longer re-runs this job,
  # and its verdict then describes a merge into the OLD base. That was the behaviour before #29 and
  # it is what #57 asks for, but it is a real edge — docs/backlog.md carries it with its trigger.
  pull_request:

# The token this job runs with is declared here rather than inherited, so it is a property of the
# tree. The repository's default workflow permissions are a settings-page toggle: they live outside
# this repository, they move with no commit and leave no diff here, and CI stays green either way —
# so without this block the answer to "what can `kit`'s token do?" is in no file at all.
# release-title.yml declares its own for the same reason (#119); this is the workflow where it
# matters more, because `kit` is the one that executes third-party code — an npm dependency tree
# via `npx`, a NuGet restore — and it runs on `pull_request`, so it runs for forks.
#
# `contents: read` is what actions/checkout needs and the whole of what this job needs: every step
# reports through its exit status, and nothing it runs reaches the GitHub API. Deliberately NOT a
# list of which steps those are — `kit` grows most months, and this repo has already learned that a
# hand-maintained inventory of it goes stale (the reason scripts/ci-wiring-check.py exists). Ask the
# file. What this block asks of a future step is only this: if one ever needs to write — post a
# comment, push, create a check-run — add the scope here, in the same diff. Adding the step alone
# fails with a loud 403 on its first run, which is why declaring too little is the safe direction to
# be wrong in.
#
# WORKFLOW level, not on the `kit` job: a job added later inherits this block. A per-job grant is
# identical today and silently reintroduces the gap tomorrow, with no diff to notice.
#
# Fork PRs already receive a read-only token whatever the default is, and nothing declared here is
# something a fork cannot be granted — so they keep running this workflow.
#
# Observed when this block landed (#146, for #132) on 2026-08-17, in the "Set up job" group of two
# `kit` runs on that PR that differ only in this block. A point-in-time record, because no test can
# read a runner's token scope and Actions logs are pruned after 90 days. Keyed by run id, not only
# by sha: the squash-merge collapses the branch, so neither sha below resolves from `main`.
#
#   run 32024138942  cdb6059  no block, inherited default   Contents + Metadata + Packages: read
#   run 32024559134  84bd241  this block                    Contents + Metadata: read
#
# So it narrows the grant rather than restating a default: `Packages: read` is gone (nothing here
# reads a GitHub Packages feed), while `Metadata: read` stays because GitHub always grants it. The
# record's real use is the other direction — it fixes what the default WAS on this date, so a later
# run showing more than `contents` means this block was dropped, not that the default drifted.
permissions:
  contents: read

# Without a group, a second push while a run is still going leaves two runs against the same
# branch, both publishing a check named `kit` — which verdict the PR settles on then depends on
# run ordering rather than on the code that is actually there. Still the right call now that
# `edited` is gone: `synchronize` bursts (a push, then an immediate follow-up push) produce the
# same race that a retitle used to. Cancel the superseded pull-request run so the latest head sha
# decides; never cancel on main, where every commit deserves its own verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # audit-inventory.sh reports FIRST_COMMIT from `git log --reverse`. On a depth-1 checkout
          # that command still succeeds — it just answers with the shallow commit — so the fallback
          # never fires and the step reports a wrong date instead of failing. Keep the full history.
          fetch-depth: 0

      # (The release-title gate was the step that used to sit here — moved in #57, see the `on:`
      # block above. #55 widened it to every shipped path and renamed it while it was in flight;
      # that newer name and rationale moved with it. Its golden test stays in this job with the
      # other tests/*/test.sh steps: that is a unit test of a script, not a gate on the title.)

      # The harness puts agent worktrees under .claude/worktrees/. Unignored, any `git add -A` run
      # in this repo stages one as a gitlink (#43). Needs only the checkout, so it sits here and
      # answers in milliseconds rather than after the toolchain.
      #
      # The caller that originally motivated this — sync-with-main.md completing a merge with
      # `git add -A` — no longer exists (#68 narrowed it to the conflicted paths, and no skill in
      # the kit runs `add -A` now). The gate stays because a human typing it in the main checkout
      # was never governed by the kit anyway; see the script header before deleting anything.
      #
      # The check is a script with a golden test rather than inline yaml, for the reason the
      # release-title gate learned the hard way: its first version WAS inline, its `mapfile` read a
      # failed `git diff` as "nothing to gate", and it skipped itself while CI stayed green —
      # a fail-open no test could reach, because an inline `run:` block cannot have one. (That
      # rationale used to sit 40 lines above this one; the gate moved to release-title.yml in #57,
      # so it is restated here rather than pointed at.) The three ways this one could quietly stop
      # working — `-q` swapped for `-v`, the trailing slash dropped, the rule broadened to
      # `.claude/` — are each driven to red in tests/worktrees-ignored/test.sh. The rationale lives
      # in the script's header.
      - name: Agent worktrees are gitignored (a stray git add -A must not commit the repo into itself)
        run: ./scripts/worktrees-ignored.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      # Installed up front, not next to the step that first needed it: check-frontmatter.py
      # parses the frontmatter as YAML rather than pattern-matching it, and it runs well
      # before the template check that used to own this install.
      - name: Install Python test dependencies
        run: python3 -m pip install --quiet PyYAML

      # The README used to enumerate the golden suites and went stale four times, which is the
      # visible half of the problem (#45). The costly half is that a suite nobody runs looks
      # exactly like a suite that passes — no red check, just an absent one. So the inventory is
      # mechanical now, and it asserts enforcement rather than mere mention: a step that is
      # commented out, `continue-on-error`, `if: false` or `|| true`-ed does not count.
      # Cheap and structural — kept ahead of the builds so it fails fast.
      - name: Every golden test suite is enforced by CI
        run: python3 scripts/ci-wiring-check.py

      # ci-wiring-check.py above proves every suite is RUN. It cannot prove any of them can be run
      # on the maintainer's machine: `tests/renovate-config/test.sh` was wired in, counted, and
      # green here for months while `bash -n` rejected it outright on macOS's bash 3.2 (#131) — the
      # documented local fast path, dead, with no red check anywhere. The two steps are deliberately
      # adjacent because they are the same question one layer apart.
      #
      # ⚠️ On this runner (bash 5) the `bash -n` half of the sweep is a NO-OP for that construct —
      # bash 5 parses it happily. What runs here is the sweep's static scan, which is
      # version-independent and does catch it; the script prints which half it is leaning on. Do not
      # read a green step here as proof that the suites parse on bash 3.2 — only a bash 3.x host can
      # say that, which is exactly why this guard also exists for the developer to run locally.
      # The sweep itself sources nothing, so it can sit up here with the other cheap structural
      # gates; its golden test sources tests/_lib.sh and therefore waits until after that helper's
      # own test, below.
      - name: Every golden test suite PARSES (the macOS bash 3.2 sweep)
        run: ./scripts/parse-sweep.sh

      # The pinned xunit.v3 version is spelled in a dozen lines beyond the constant Renovate bumps,
      # and #69's `[7e]` sweep covered two files of them on purpose — the rest needed a policy, not
      # a wider regex (#90). This is that policy's gate: every spelling is either MARKED as derived
      # from XUNIT_V3_VERSION (and held to it) or RECORDED as historical with a reason; a new,
      # unmarked copy fails here by name. Loud by default, because the alternative — an exclusion
      # list — would instead sweep the next copy into agreement, and the deliberately-historical
      # spellings (the xunit.v3.mtp-v2 enumerations, the scratch .csproj the transform test feeds
      # itself) must never move.
      #
      # Cheap and structural — stdlib Python and `git ls-files`, no toolchain — so it sits with the
      # other fast gates rather than behind the builds. Its golden test runs below, with the suites.
      - name: Every spelling of the pinned version is marked or recorded
        run: python3 scripts/pinned-literals-check.py

      # Ten suites now get their EXIT trap from tests/_lib.sh (#72), so a bug in that handler would
      # silently weaken all of them at once — the `local rc=$?`-first invariant is the difference
      # between a failing suite reporting failure and reporting success. It sits AHEAD of every
      # suite that sources the helper, ci-wiring included: otherwise a regression in the shared
      # handler surfaces first as an unexplained failure somewhere else, with the step that would
      # name the cause still queued behind it.
      - name: Shared test preamble golden test (the rc invariant every suite now leans on)
        run: ./tests/lib/test.sh

      # Same argument, one file over (#51): tests/_lib/py.sh is now the kit's ONLY importlib
      # loader, sourced by the xunit-v3 and report-dashboard suites, so a regression there weakens
      # both at once — and its worst failure mode is silent. A `py_module` call whose heredoc went
      # missing used to exit 0 having asserted nothing, and this step's suite drives that refusal.
      # Ahead of both tenants, for the reason the step above gives.
      - name: Shared module-loader golden test (refusal paths, and the no-__pycache__ invariant)
        run: ./tests/py-module/test.sh

      # …and the wiring guard gets the same treatment it exists to enforce: a golden test over its
      # refusal path. An inline `run:` block could not have one, which is exactly how the first
      # version of scripts/release-title-gate.sh managed to fail open.
      - name: CI-wiring guard golden test (refusal paths, not just the happy one)
        run: ./tests/ci-wiring/test.sh

      # …and so does the parse sweep, for the same reason. It sits HERE rather than beside its gate
      # above because it sources tests/_lib.sh, and the two steps above are the ones that name a
      # regression in the shared helper instead of leaving it to surface as an unexplained failure.
      # Note what this step does and does not prove: on bash 5 the sweep's `bash -n` half is blind
      # to the #131 construct, so the red cases here assert the STATIC scan's message rather than a
      # bare non-zero exit — otherwise they would pass on this runner for the wrong reason.
      - name: Parse sweep golden test (the #131 construct, driven to red)
        run: ./tests/parse-sweep/test.sh

      # The pinned-literals guard's own refusal paths (#90). A guard is worth exactly what its
      # refusal path is worth, and this one's refusals are the whole design: an unmarked new copy
      # must FAIL rather than be swept into agreement, and the deliberately-historical spellings
      # (the xunit.v3.mtp-v2 enumerations, the scratch .csproj the transform test feeds itself)
      # must be left alone. Both directions are driven over fixtures here. Sources tests/_lib.sh,
      # so it sits after that helper's own test, like the two golden tests above it.
      - name: Pinned-literals golden test (an unmarked copy refuses; a historical one is left alone)
        run: ./tests/pinned-literals/test.sh

      - name: Fixture LegacyShop — build + tests (must stay green AND legacy)
        run: dotnet test samples/LegacyShop --nologo

      - name: xunit v3 transform golden test (scratch copy, fixture untouched)
        run: ./tests/xunit-v3/test.sh

      - name: Plugin manifests and requirements are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool requirements.json > /dev/null
          python3 -m json.tool release-please-config.json > /dev/null
          python3 -m json.tool .release-please-manifest.json > /dev/null
          # A malformed renovate.json does not fail anything visibly: Renovate simply stops
          # proposing updates for the repo, and the only symptom is an absence of PRs.
          python3 -m json.tool renovate.json > /dev/null

      # Parsing is not acceptance. The step above proves renovate.json is JSON; this one asks the
      # engine that consumes it. `customManagers` must compile under RE2, and any unknown key raises
      # CONFIG_VALIDATION — at which point Renovate stops managing the WHOLE repository and the only
      # symptom is an absence of PRs. #34 added the parse check and explicitly left this half.
      - name: renovate.json is a config Renovate actually accepts
        env:
          # The pin is NOT optional, and not merely a guard against some future major. Measured in
          # #66: `npx --package renovate` with no version resolved 37.440.7 — a major predating
          # `managerFilePatterns` (successor to `fileMatch`) — and reported 8 Configuration Errors
          # against a config the real Renovate accepts. An unpinned gate is red on correct input,
          # and its obvious "fix" would silently downgrade the config. Floor is major 40.
          # Bumped by the customManager in renovate.json; tests/renovate-config asserts both.
          RENOVATE_VALIDATOR_VERSION: 44.29.4
        run: |
          # Both flags are load-bearing and both were MEASURED against this pin in #79, not read
          # off the docs. Dropping either one re-opens a hole that leaves CI green.
          #
          # --no-global: passing a filename positionally makes the validator judge it as a GLOBAL
          #   self-hosted config — it even says so, "Validating renovate.json as global config".
          #   This file is a REPO config. Measured: `autodiscover` and `baseDir`, which Renovate
          #   ignores outright in a repo config, PASS without this flag and fail with it. That is
          #   the silent-ignore failure this gate exists to catch, sitting inside the gate itself.
          #
          # --strict: NOT what catches an unknown key — a mistyped key inside customManagers
          #   already exits 1 unflagged, because renovate 44 sets returnVal=1 on warnings too.
          #   `strict` is consulted in exactly one branch, `if (isMigrated)`. So it means "fail if
          #   the config needs migration", and it is the only thing that catches a stale spelling
          #   such as `fileMatch` for `managerFilePatterns` — measured: exit 0 without, 1 with.
          #
          # RE2 is an OPTIONAL native module. When it fails to load, the validator falls back to JS
          # RegExp, keeps exiting 0, and only says so in a bare WARN line that res.errors/warnings
          # never see — so an RE2-only-invalid matchStrings pattern could pass here silently,
          # forever (#130). `tee` streams the combined output live — a cold npx cache can spend tens
          # of seconds resolving/downloading, and capturing to a file with nothing printed until the
          # command exits made that stretch indistinguishable from a hang — while still keeping a
          # copy on disk for the check below. `${PIPESTATUS[0]}` is npx's own exit code, not tee's
          # (tee always succeeds), which is why it is read instead of the pipeline's `$?`.
          validator_output=$(mktemp)
          set +e
          npx --yes --package "renovate@$RENOVATE_VALIDATOR_VERSION" -- \
            renovate-config-validator --no-global --strict renovate.json 2>&1 | tee "$validator_output"
          validator_status=${PIPESTATUS[0]}
          set -e
          if grep -q 'RE2 not usable' "$validator_output"; then
            # The message names the ENGINE as the cause only when the validator's own exit code was
            # 0: that is the case #130 is about, where a degraded engine hides behind a silent pass.
            # When validator_status is already nonzero, renovate.json may ALSO be broken for a
            # reason of its own (already printed above by the stream) — claiming the engine is "the"
            # cause in that case would send a reader chasing the wrong half of a compound failure.
            if [ "$validator_status" -eq 0 ]; then
              echo "::error::renovate-config-validator's RE2 engine did not load, so this run validated renovate.json on JS RegExp instead of RE2 — the validator's own success is only trustworthy on RE2, and a matchStrings pattern only RE2 would reject could have passed here silently. See #130."
            else
              echo "::error::renovate-config-validator's RE2 engine did not load, on top of it already rejecting renovate.json for a reason of its own (see the output above) — fix that failure first; regex validation cannot be trusted on JS RegExp alone until RE2 loads. See #130."
            fi
            exit 1
          fi
          exit "$validator_status"

      - name: Renovate config golden test (accepts the real config; rejects unknown, global-only and unmigrated keys)
        run: ./tests/renovate-config/test.sh

      # release-please stamps both files in the same release PR, so a mismatch means someone
      # hand-edited one of them — which would make the next computed version wrong.
      - name: Plugin version matches the release-please manifest
        run: |
          plugin=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          manifest=$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")
          if [ "$plugin" != "$manifest" ]; then
            echo "plugin.json is $plugin but .release-please-manifest.json is $manifest"; exit 1
          fi

      - name: Every phase guide names its RoselineMCP tools
        run: |
          bad=$(grep -L 'analyze_solution\|list_diagnostics\|apply_fixes\|edit_member\|rename_symbol\|find_references\|get_call_graph\|get_symbol_at_position\|search_symbols' skills/legacy-upgrade/references/phase-*.md || true)
          if [ -n "$bad" ]; then echo "Phase guides missing tool names: $bad"; exit 1; fi

      - name: Preflight script runs (required tooling present on runner)
        run: ./scripts/preflight.sh

      - name: Preflight --json emits valid JSON
        run: ./scripts/preflight.sh --json | python3 -m json.tool > /dev/null

      - name: Preflight golden test (requirements.json = source unique)
        run: ./tests/preflight/test.sh

      - name: Repo-profile script golden test (show/detect, TODO-fallback contract)
        run: ./tests/repo-profile/test.sh

      # The other half of the same story: repo-profile READS a repo's configuration, repo-setup
      # establishes it (#192). Drives idempotence, the additive/--prune split, never-clobber on an
      # existing issue form, and per-surface degradation — all against a stateful gh stub.
      - name: Repo-setup script golden test (plan/apply, idempotence, degradation)
        run: ./tests/repo-setup/test.sh

      - name: Kit scripts run from a foreign working directory (plugin-install simulation)
        run: |
          KIT="$PWD"
          cd "$(mktemp -d)"
          bash "$KIT/scripts/preflight.sh" --json | python3 -m json.tool > /dev/null
          bash "$KIT/scripts/audit-inventory.sh" "$KIT/samples/LegacyShop" | python3 -m json.tool > /dev/null
          python3 "$KIT/scripts/followups.py" "$KIT/tests/followups/fixture-a" --backlog "$KIT/docs/backlog.md" > /dev/null
          # The answer must come from the directory the helper is GIVEN, never from this foreign
          # CWD. Two calls from the same place, two deterministic and DIFFERENT answers — which is
          # the property this simulation exists to check, and which a single call cannot show.
          # The kit tracks its own profile since #157, so `show "$KIT"` must print that file
          # verbatim; the scratch dir we are standing in has none, so it must report the named
          # NO_PROFILE condition (exit 3) rather than fall back to the kit's.
          out=$(bash "$KIT/skills/get-repo-profile/scripts/repo-profile.sh" show "$KIT")
          [ "$out" = "$(cat "$KIT/.claude/skills/repo-profile.md")" ]
          rc=0
          out=$(bash "$KIT/skills/get-repo-profile/scripts/repo-profile.sh" show "$PWD") || rc=$?
          [ "$rc" = 3 ] && [ "$out" = "NO_PROFILE" ]
          # The guards exist to be called from someone else's checkout, so they belong in this
          # simulation too. --help exercises the header slice against $0 (a hardcoded line range
          # there silently stops documenting the exit codes), and the refusal proves the guard
          # reads -C rather than this foreign CWD.
          # Both checks loop over ALL the guards. The refusal used to be asserted for
          # guarded-commit alone while the comment claimed it for "the guard" generally — so a
          # sibling that lost its `-d`/`rev-parse --git-dir` pre-flight, or gained a `cd`, would
          # keep CI green while a plugin-installed kit wrote into whatever repo the session
          # happened to be sitting in. That is the exact scenario this simulation exists to catch.
          for g in guarded-commit guarded-push guarded-merge; do
            script="$KIT/skills/implement-issue/scripts/$g.sh"
            bash "$script" --help | grep -q 'Exit codes:'
            if bash "$script" -C "$PWD" no-such-branch -- -m x 2>/dev/null; then
              echo "$g.sh accepted a path that is not a git repository"; exit 1
            fi
          done

      - name: Skill frontmatter conforms to the guide (limits, fields, trigger lists, requirements cross-check)
        run: python3 tests/skills/check-frontmatter.py

      # The frontmatter checker asserts a key is ABSENT, which the six real skills already
      # satisfy — so its pass path proves nothing and a guard that stopped matching would
      # stay green. This drives it over fixtures that must be rejected.
      - name: Frontmatter checker golden test (rejects every spelling of a version key)
        run: ./tests/skills/test.sh

      - name: Inventory script runs and emits valid JSON
        run: ./scripts/audit-inventory.sh samples/LegacyShop | python3 -m json.tool > /dev/null

      - name: Inventory golden test — vendoredAssets (reported, covered, empty, nested)
        run: ./tests/audit-inventory/test.sh

      # Recursive since #192: the issue forms repo-setup copies into a consumer's repository live
      # in templates/issue-forms/, and the old non-recursive glob did not reach them — they would
      # have shipped unvalidated, which is the "wired in but enforcing nothing" shape
      # ci-wiring-check.py exists to prevent. Strictly wider than before, so nothing that was
      # covered stops being covered.
      - name: Templates are valid YAML
        run: python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('templates/**/*.yml', recursive=True)]"

      # The step above only proves the template PARSES. The opt-in bundle gate is live YAML since
      # #70, so it is covered by that parse — but parsing says nothing about whether the guard
      # still catches drift. This one EXECUTES it, both ways: against bundles that are stale
      # (renamed, added-to, gitignored-and-force-added) and one that matches, plus the three
      # misconfigurations that must be refused rather than passed over in silence.
      - name: CI template golden test — the opt-in committed-bundle drift gate
        run: ./tests/ci-template/test.sh

      - name: Report generator golden test (fixture → HTML assertions)
        run: ./tests/report-dashboard/test.sh

      - name: Followups aggregator golden test (tri, backlog, erreurs, JSON)
        run: ./tests/followups/test.sh

      - name: Tick-plan golden test (a bad body never reaches GitHub)
        run: ./tests/tick-plan/test.sh

      - name: Guarded git golden test (a commit cannot land on the wrong branch)
        run: ./tests/guarded-git/test.sh

      - name: Merge-gate golden test (the latest run per job decides, over fixtures)
        run: ./tests/merge-gate/test.sh

      - name: Merge-freshness golden test (a stale CLEAN must not merge)
        run: ./tests/merge-freshness/test.sh

      - name: Guarded PR-merge golden test (state decides the takeover, never gh's exit code)
        run: ./tests/guarded-pr-merge/test.sh

      - name: Release-title gate golden test (pass AND fail paths)
        run: ./tests/release-title-gate/test.sh

      - name: Worktrees-ignored golden test (the gate above, driven to red)
        run: ./tests/worktrees-ignored/test.sh

      - name: Roseline golden test (shipped MCP config + the gate, driven to red)
        run: ./tests/roseline/test.sh

      - name: Auto-dev never-wait golden test (worker prompt + recovery clause pinned)
        run: ./tests/auto-dev-never-wait/test.sh

      - name: Survey golden test (effort tiers by the manifest's own vocabulary, not S/M/L)
        run: ./tests/survey/test.sh

      - name: Contrast checker works (pass AND fail paths)
        run: |
          python3 scripts/contrast-check.py "#000000:#ffffff:sanité"
          if python3 scripts/contrast-check.py "#777777:#888888" >/dev/null 2>&1; then
            echo "contrast-check aurait dû échouer sur une paire illisible"; exit 1
          fi
