name: ci

on:
  push:
    branches: [main]
  # `edited` is load-bearing: the release-title gate below reads the PR *title*, so retitling has
  # to re-run it — otherwise a PR could go green as `fix(skills):` and be tidied to `chore(skills):`
  # before the merge. Naming any type replaces the defaults, so opened/synchronize/reopened are
  # listed explicitly rather than inherited.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Without a group, a retitle starts a second run against the *same* head sha while the first is
# still going, and both publish a check named `kit` — which verdict the PR settles on then depends
# on run ordering rather than on the title that is actually there. That would defeat the reason
# `edited` was added at all. Cancel the superseded pull-request run so the latest title decides;
# never cancel on main, where every commit deserves its own verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # audit-inventory.sh reports FIRST_COMMIT from `git log --reverse`. On a depth-1 checkout
          # that command still succeeds — it just answers with the shallow commit — so the fallback
          # never fires and the step reports a wrong date instead of failing. Keep the full history.
          fetch-depth: 0

      # Consumers install a version-keyed cache of this plugin (#6) — a whole-repo checkout of the
      # tagged commit — so a change to anything they run reaches nobody until release-please cuts a
      # release, and this repo squash-merges, so the PR title is the commit release-please will read
      # on main. #7 enforced that with a per-PR version bump; #14 rightly retired it when
      # release-please landed, leaving the guarantee resting on an unchecked precondition (#27).
      # This step is that check. Fail-fast, before the builds.
      #
      # It covers all shipped content, not just skills/ (#55): the gate defines "shipped" by
      # exclusion, so scripts/, commands/, templates/, hooks/ and requirements.json are gated too.
      # Keep this step NAME accurate — it is the label on the red check a contributor sees.
      - name: Shipped-content changes carry a releasable PR title
        if: github.event_name == 'pull_request'
        env:
          # Never interpolate ${{ … }} into a run: block — a PR title is attacker-controlled on
          # fork PRs and would be pasted into the script the shell parses. Through the environment
          # it stays data, and the step needs no secrets, so forks can run it.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The path list comes from a script with its own golden test, not from inline yaml.
          # Inline, `mapfile -t x < <(git diff …)` swallowed git's exit status, so a missing sha
          # produced an empty array that the next line read as "nothing to gate" — the gate
          # skipped itself and CI stayed green. Here the exit status is the only thing that
          # separates "no files changed" from "could not tell", and it is checked.
          if ! ./scripts/release-title-diff.sh "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.z"; then
            echo "could not determine the changed paths — failing rather than skipping the gate"
            exit 1
          fi
          mapfile -d '' -t changed < "$RUNNER_TEMP/changed.z"
          # Authoritative now: the script exited 0, so an empty list really is an empty diff —
          # e.g. the scaffold-only commit of a freshly opened draft PR.
          if [ ${#changed[@]} -eq 0 ]; then
            echo "empty diff against the merge base — nothing to gate."; exit 0
          fi
          ./scripts/release-title-gate.sh "$PR_TITLE" "${changed[@]}"

      # The harness puts agent worktrees under .claude/worktrees/. Unignored, any `git add -A` run
      # in this repo stages one as a gitlink (#43). Needs only the checkout, so it sits here and
      # answers in milliseconds rather than after the toolchain.
      #
      # The caller that originally motivated this — sync-with-main.md completing a merge with
      # `git add -A` — no longer exists (#68 narrowed it to the conflicted paths, and no skill in
      # the kit runs `add -A` now). The gate stays because a human typing it in the main checkout
      # was never governed by the kit anyway; see the script header before deleting anything.
      #
      # The check is a script with a golden test rather than inline yaml, for the reason written 40
      # lines above: the last inline guard in this file failed open and nothing could test it. The
      # three ways this one could quietly stop working — `-q` swapped for `-v`, the trailing slash
      # dropped, the rule broadened to `.claude/` — are each driven to red in
      # tests/worktrees-ignored/test.sh. The rationale lives in the script's header.
      - name: Agent worktrees are gitignored (a stray git add -A must not commit the repo into itself)
        run: ./scripts/worktrees-ignored.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      # Installed up front, not next to the step that first needed it: check-frontmatter.py
      # parses the frontmatter as YAML rather than pattern-matching it, and it runs well
      # before the template check that used to own this install.
      - name: Install Python test dependencies
        run: python3 -m pip install --quiet PyYAML

      # The README used to enumerate the golden suites and went stale four times, which is the
      # visible half of the problem (#45). The costly half is that a suite nobody runs looks
      # exactly like a suite that passes — no red check, just an absent one. So the inventory is
      # mechanical now, and it asserts enforcement rather than mere mention: a step that is
      # commented out, `continue-on-error`, `if: false` or `|| true`-ed does not count.
      # Cheap and structural — kept ahead of the builds so it fails fast.
      - name: Every golden test suite is enforced by CI
        run: python3 scripts/ci-wiring-check.py

      # Ten suites now get their EXIT trap from tests/_lib.sh (#72), so a bug in that handler would
      # silently weaken all of them at once — the `local rc=$?`-first invariant is the difference
      # between a failing suite reporting failure and reporting success. It sits AHEAD of every
      # suite that sources the helper, ci-wiring included: otherwise a regression in the shared
      # handler surfaces first as an unexplained failure somewhere else, with the step that would
      # name the cause still queued behind it.
      - name: Shared test preamble golden test (the rc invariant every suite now leans on)
        run: ./tests/lib/test.sh

      # …and the wiring guard gets the same treatment it exists to enforce: a golden test over its
      # refusal path. An inline `run:` block could not have one, which is exactly how the first
      # version of scripts/release-title-gate.sh managed to fail open.
      - name: CI-wiring guard golden test (refusal paths, not just the happy one)
        run: ./tests/ci-wiring/test.sh

      - name: Fixture LegacyShop — build + tests (must stay green AND legacy)
        run: dotnet test samples/LegacyShop --nologo

      - name: xunit v3 transform golden test (scratch copy, fixture untouched)
        run: ./tests/xunit-v3/test.sh

      - name: Plugin manifests and requirements are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool requirements.json > /dev/null
          python3 -m json.tool release-please-config.json > /dev/null
          python3 -m json.tool .release-please-manifest.json > /dev/null
          # A malformed renovate.json does not fail anything visibly: Renovate simply stops
          # proposing updates for the repo, and the only symptom is an absence of PRs.
          python3 -m json.tool renovate.json > /dev/null

      # Parsing is not acceptance. The step above proves renovate.json is JSON; this one asks the
      # engine that consumes it. `customManagers` must compile under RE2, and any unknown key raises
      # CONFIG_VALIDATION — at which point Renovate stops managing the WHOLE repository and the only
      # symptom is an absence of PRs. #34 added the parse check and explicitly left this half.
      - name: renovate.json is a config Renovate actually accepts
        env:
          # The pin is NOT optional, and not merely a guard against some future major. Measured in
          # #66: `npx --package renovate` with no version resolved 37.440.7 — a major predating
          # `managerFilePatterns` (successor to `fileMatch`) — and reported 8 Configuration Errors
          # against a config the real Renovate accepts. An unpinned gate is red on correct input,
          # and its obvious "fix" would silently downgrade the config. Floor is major 40.
          # Bumped by the customManager in renovate.json; tests/renovate-config asserts both.
          RENOVATE_VALIDATOR_VERSION: 44.29.4
        run: |
          npx --yes --package "renovate@$RENOVATE_VALIDATOR_VERSION" -- \
            renovate-config-validator renovate.json

      - name: Renovate config golden test (accepts the real config, rejects an unknown key)
        run: ./tests/renovate-config/test.sh

      # release-please stamps both files in the same release PR, so a mismatch means someone
      # hand-edited one of them — which would make the next computed version wrong.
      - name: Plugin version matches the release-please manifest
        run: |
          plugin=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          manifest=$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")
          if [ "$plugin" != "$manifest" ]; then
            echo "plugin.json is $plugin but .release-please-manifest.json is $manifest"; exit 1
          fi

      - name: Every phase guide names its RoselineMCP tools
        run: |
          bad=$(grep -L 'analyze_solution\|list_diagnostics\|apply_fixes\|edit_member\|rename_symbol\|find_references\|get_call_graph\|get_symbol_at_position\|search_symbols' skills/legacy-upgrade/references/phase-*.md || true)
          if [ -n "$bad" ]; then echo "Phase guides missing tool names: $bad"; exit 1; fi

      - name: Preflight script runs (required tooling present on runner)
        run: ./scripts/preflight.sh

      - name: Preflight --json emits valid JSON
        run: ./scripts/preflight.sh --json | python3 -m json.tool > /dev/null

      - name: Preflight golden test (requirements.json = source unique)
        run: ./tests/preflight/test.sh

      - name: Repo-profile script golden test (show/detect, TODO-fallback contract)
        run: ./tests/repo-profile/test.sh

      - name: Kit scripts run from a foreign working directory (plugin-install simulation)
        run: |
          KIT="$PWD"
          cd "$(mktemp -d)"
          bash "$KIT/scripts/preflight.sh" --json | python3 -m json.tool > /dev/null
          bash "$KIT/scripts/audit-inventory.sh" "$KIT/samples/LegacyShop" | python3 -m json.tool > /dev/null
          python3 "$KIT/scripts/followups.py" "$KIT/tests/followups/fixture-a" --backlog "$KIT/docs/backlog.md" > /dev/null
          out=$(bash "$KIT/skills/get-repo-profile/scripts/repo-profile.sh" show "$KIT") || true
          [ "$out" = "NO_PROFILE" ]   # kit has no profile: the deterministic answer, from any CWD
          # The guards exist to be called from someone else's checkout, so they belong in this
          # simulation too. --help exercises the header slice against $0 (a hardcoded line range
          # there silently stops documenting the exit codes), and the refusal proves the guard
          # reads -C rather than this foreign CWD.
          # Both checks loop over ALL the guards. The refusal used to be asserted for
          # guarded-commit alone while the comment claimed it for "the guard" generally — so a
          # sibling that lost its `-d`/`rev-parse --git-dir` pre-flight, or gained a `cd`, would
          # keep CI green while a plugin-installed kit wrote into whatever repo the session
          # happened to be sitting in. That is the exact scenario this simulation exists to catch.
          for g in guarded-commit guarded-push guarded-merge; do
            script="$KIT/skills/implement-issue/scripts/$g.sh"
            bash "$script" --help | grep -q 'Exit codes:'
            if bash "$script" -C "$PWD" no-such-branch -- -m x 2>/dev/null; then
              echo "$g.sh accepted a path that is not a git repository"; exit 1
            fi
          done

      - name: Skill frontmatter conforms to the guide (limits, fields, trigger lists, requirements cross-check)
        run: python3 tests/skills/check-frontmatter.py

      # The frontmatter checker asserts a key is ABSENT, which the six real skills already
      # satisfy — so its pass path proves nothing and a guard that stopped matching would
      # stay green. This drives it over fixtures that must be rejected.
      - name: Frontmatter checker golden test (rejects every spelling of a version key)
        run: ./tests/skills/test.sh

      - name: Inventory script runs and emits valid JSON
        run: ./scripts/audit-inventory.sh samples/LegacyShop | python3 -m json.tool > /dev/null

      - name: Inventory golden test — vendoredAssets (reported, covered, empty, nested)
        run: ./tests/audit-inventory/test.sh

      - name: Templates are valid YAML
        run: python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('templates/*.yml')]"

      # The step above only proves the template PARSES. The opt-in bundle gate is live YAML since
      # #70, so it is covered by that parse — but parsing says nothing about whether the guard
      # still catches drift. This one EXECUTES it, both ways: against bundles that are stale
      # (renamed, added-to, gitignored-and-force-added) and one that matches, plus the three
      # misconfigurations that must be refused rather than passed over in silence.
      - name: CI template golden test — the opt-in committed-bundle drift gate
        run: ./tests/ci-template/test.sh

      - name: Report generator golden test (fixture → HTML assertions)
        run: ./tests/report-dashboard/test.sh

      - name: Followups aggregator golden test (tri, backlog, erreurs, JSON)
        run: ./tests/followups/test.sh

      - name: Tick-plan golden test (a bad body never reaches GitHub)
        run: ./tests/tick-plan/test.sh

      - name: Guarded git golden test (a commit cannot land on the wrong branch)
        run: ./tests/guarded-git/test.sh

      - name: Release-title gate golden test (pass AND fail paths)
        run: ./tests/release-title-gate/test.sh

      - name: Worktrees-ignored golden test (the gate above, driven to red)
        run: ./tests/worktrees-ignored/test.sh

      - name: Roseline golden test (shipped MCP config + the gate, driven to red)
        run: ./tests/roseline/test.sh

      - name: Contrast checker works (pass AND fail paths)
        run: |
          python3 scripts/contrast-check.py "#000000:#ffffff:sanité"
          if python3 scripts/contrast-check.py "#777777:#888888" >/dev/null 2>&1; then
            echo "contrast-check aurait dû échouer sur une paire illisible"; exit 1
          fi
