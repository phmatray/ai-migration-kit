# Template CI ai-migration-kit — à déposer dans le repo migré (.github/workflows/ci.yml), phase 6.
# La migration ne livre pas que du code : elle livre le garde-fou.
# ⚠ Renseignez SOLUTION si le repo contient plusieurs .sln (l'ancienne solution legacy reste
#   souvent à la racine) : `dotnet test` nu échoue alors avec MSB1011.
name: ci

on:
  push:
    branches: [main, dev, 'migration/**']
  pull_request:

env:
  SOLUTION: ''   # ex. Chords.sln — laissez vide si un seul .sln à la racine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Deux plateformes de test coexistent, et elles ne collectent PAS la couverture pareil :
      #   - VSTest (xunit v2, NUnit, MSTest classique) → `--collect:"XPlat Code Coverage"` ;
      #   - Microsoft Testing Platform (xunit.v3) → `--coverage`, via
      #     Microsoft.Testing.Extensions.CodeCoverage référencé par le projet de test.
      # Mesuré : sous MTP, `--collect:` est IGNORÉ — la commande sort en 0, tous les tests
      # passent, et AUCUN fichier de couverture n'est écrit (simple avertissement MTP0001).
      # D'où la détection, puis la garde ci-dessous. Détail : legacy-upgrade
      # references/xunit-v3-migration.md.
      - name: Tests + couverture
        run: |
          set -euo pipefail
          mkdir -p coverage
          mtp=$(grep -rlE 'xunit\.v3|TestingPlatformDotnetTestSupport' --include='*.csproj' . || true)
          vstest=$(grep -rlE 'PackageReference[^>]*Include="(xunit\.runner\.visualstudio|MSTest\.TestAdapter|NUnit3TestAdapter|coverlet\.collector)"' \
                     --include='*.csproj' . || true)
          if [ -n "$mtp" ] && [ -n "$vstest" ]; then
            # Un dépôt à moitié migré est le pire cas : les arguments MTP sont IGNORÉS en silence
            # par les projets VSTest (sortie 0, tests verts, zéro fichier), et la garde ci-dessous
            # passe quand même parce que le projet v3, lui, en a écrit un. On refuse plutôt que de
            # perdre la couverture d'une moitié du dépôt sans le dire.
            echo "Dépôt MIXTE : des projets MTP (xunit.v3) et VSTest coexistent."
            echo "  MTP    : $(echo "$mtp" | tr '\n' ' ')"
            echo "  VSTest : $(echo "$vstest" | tr '\n' ' ')"
            echo "Une seule commande ne peut pas collecter la couverture des deux."
            echo "Terminez la migration, ou collectez projet par projet."
            exit 1
          elif [ -n "$mtp" ]; then
            # `--coverage-output` nomme UN fichier, et chaque projet de test de la solution
            # est un exécutable MTP autonome qui obéit à ce nom : avec N projets, N-1
            # rapports sont écrasés et il reste celui qui a fini en dernier. Mesuré sur une
            # solution à 2 projets : 5 % de couverture affichés là où l'union en couvre 73 %.
            # Un chiffre faux, pas un chiffre manquant — rien ne signale qu'il est partiel.
            # `--results-directory` sans `--coverage-output` laisse MTP nommer lui-même, un
            # fichier par projet, et aligne cette branche sur celle de VSTest juste en dessous.
            echo "Plateforme de test détectée : Microsoft Testing Platform."
            dotnet test $SOLUTION --nologo -- \
              --coverage --coverage-output-format cobertura \
              --results-directory "$PWD/coverage"
          else
            echo "Plateforme de test détectée : VSTest."
            dotnet test $SOLUTION --nologo --collect:"XPlat Code Coverage" --results-directory coverage
          fi

      # Sans cette garde, une collecte qui ne produit rien passe pour un succès : l'artefact part
      # vide et le tableau de bord affiche « pas de couverture » sur une app qui EST testée.
      - name: Garde — la couverture a bien été produite
        run: |
          if ! find coverage -name '*.cobertura.xml' | grep -q . ; then
            echo "Aucun rapport de couverture produit — la collecte a été ignorée en silence."
            echo "Projet MTP sans Microsoft.Testing.Extensions.CodeCoverage ? Voir"
            echo "legacy-upgrade/references/xunit-v3-migration.md."
            exit 1
          fi

      - name: Publier la couverture en artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          # VSTest niche un fichier par projet sous un dossier GUID, MTP les écrit à plat sous
          # un nom GUID : les deux motifs, sinon l'artefact d'une des deux plateformes part
          # vide sans que rien ne le dise. Le nom du fichier n'est plus fixe — c'est ce qui
          # empêche deux projets de test de s'écraser — donc le glob prend *.cobertura.xml.
          path: |
            coverage/**/*.cobertura.xml
            coverage/*.cobertura.xml
