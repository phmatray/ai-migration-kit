# Template CI ai-migration-kit — à déposer dans le repo migré (.github/workflows/ci.yml), phase 6.
# La migration ne livre pas que du code : elle livre le garde-fou.
# ⚠ Renseignez SOLUTION si le repo contient plusieurs .sln (l'ancienne solution legacy reste
#   souvent à la racine) : `dotnet test` nu échoue alors avec MSB1011.
name: ci

on:
  push:
    branches: [main, dev, 'migration/**']
  pull_request:

env:
  SOLUTION: ''   # ex. Chords.sln — laissez vide si un seul .sln à la racine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Deux plateformes de test coexistent, et elles ne collectent PAS la couverture pareil :
      #   - VSTest (xunit v2, NUnit, MSTest classique) → `--collect:"XPlat Code Coverage"` ;
      #   - Microsoft Testing Platform (xunit.v3) → `--coverage`, via
      #     Microsoft.Testing.Extensions.CodeCoverage référencé par le projet de test.
      # Mesuré : sous MTP, `--collect:` est IGNORÉ — la commande sort en 0, tous les tests
      # passent, et AUCUN fichier de couverture n'est écrit (simple avertissement MTP0001).
      # D'où la détection, puis la garde ci-dessous. Détail : legacy-upgrade
      # references/xunit-v3-migration.md.
      - name: Tests + couverture
        run: |
          set -euo pipefail
          # Repartir d'un coverage/ VIDE, pas seulement l'assurer présent. Tant que le fichier
          # portait un nom fixe, chaque run écrasait le précédent et le répertoire ne pouvait
          # pas mentir ; maintenant que chaque projet nomme son rapport, les runs
          # s'accumuleraient — et sur un runner self-hosted (workspace réutilisé) la garde
          # ci-dessous passerait sur le rapport d'hier pendant qu'une collecte muette ne
          # produit plus rien. L'agrégat compterait en prime des classes déjà supprimées.
          rm -rf coverage && mkdir -p coverage
          # Même raison, deuxième emplacement (#74). MTP n'écrit pas toujours sous coverage/ :
          # quand `--coverage` est refusé, `--results-directory` l'est avec lui et le log retombe
          # sous `<projet>/bin/<config>/<tfm>/TestResults/`. Ce chemin-là est publié en artefact,
          # donc il doit être aussi propre que coverage/ — sinon un run VERT embarque le log
          # d'échec d'un run précédent, et l'artefact explique une panne qui n'a pas eu lieu.
          # C'est pire que le log manquant que #74 corrige : faux, pas absent.
          # Restreint à `*/bin/*` : un dépôt legacy peut committer un TestResults/ dans ses
          # sources, et ce nettoyage ne doit jamais toucher un fichier suivi par git.
          find . -type d -path '*/bin/*' -name TestResults -prune -exec rm -rf {} + 2>/dev/null || true
          mtp=$(grep -rlE 'xunit\.v3|TestingPlatformDotnetTestSupport' --include='*.csproj' . || true)
          vstest=$(grep -rlE 'PackageReference[^>]*Include="(xunit\.runner\.visualstudio|MSTest\.TestAdapter|NUnit3TestAdapter|coverlet\.collector)"' \
                     --include='*.csproj' . || true)
          if [ -n "$mtp" ] && [ -n "$vstest" ]; then
            # Un dépôt à moitié migré est le pire cas : les arguments MTP sont IGNORÉS en silence
            # par les projets VSTest (sortie 0, tests verts, zéro fichier), et la garde ci-dessous
            # passe quand même parce que le projet v3, lui, en a écrit un. On refuse plutôt que de
            # perdre la couverture d'une moitié du dépôt sans le dire.
            echo "Dépôt MIXTE : des projets MTP (xunit.v3) et VSTest coexistent."
            echo "  MTP    : $(echo "$mtp" | tr '\n' ' ')"
            echo "  VSTest : $(echo "$vstest" | tr '\n' ' ')"
            echo "Une seule commande ne peut pas collecter la couverture des deux."
            echo "Terminez la migration, ou collectez projet par projet."
            exit 1
          elif [ -n "$mtp" ]; then
            # `--coverage-output` nomme UN fichier, et chaque projet de test de la solution
            # est un exécutable MTP autonome qui obéit à ce nom : avec N projets, N-1
            # rapports sont écrasés et il reste celui qui a fini en dernier. Mesuré sur une
            # solution à 2 projets : 5 % de couverture affichés là où l'union en couvre 73 %.
            # Un chiffre faux, pas un chiffre manquant — rien ne signale qu'il est partiel.
            # `--results-directory` sans `--coverage-output` laisse MTP nommer lui-même, un
            # fichier par projet, et aligne cette branche sur celle de VSTest juste en dessous.
            echo "Plateforme de test détectée : Microsoft Testing Platform."
            dotnet test $SOLUTION --nologo -- \
              --coverage --coverage-output-format cobertura \
              --results-directory "$PWD/coverage"
          else
            echo "Plateforme de test détectée : VSTest."
            dotnet test $SOLUTION --nologo --collect:"XPlat Code Coverage" --results-directory coverage
          fi

      # Sans cette garde, une collecte qui ne produit rien passe pour un succès : l'artefact part
      # vide et le tableau de bord affiche « pas de couverture » sur une app qui EST testée.
      #
      # ⚠ Cette garde teste une PRÉSENCE, pas un COMPTE, et c'est délibéré (#31). Comparer le
      #   nombre de rapports au nombre de projets de test découverts dans `$mtp` paraît plus
      #   strict — « 1 rapport pour 3 projets » virerait au rouge. Deux mesures s'y opposent
      #   (SDK 10.0.302, xunit.v3 3.2.2, CodeCoverage 17.14.2) :
      #
      #   1. Il n'existe plus de cause connue de collecte PARTIELLE silencieuse. `--coverage` est
      #      une option APPORTÉE par Microsoft.Testing.Extensions.CodeCoverage : un projet qui n'a
      #      pas ce paquet ne se contente pas de ne rien produire, il fait refuser l'option
      #      (« Unknown option '--coverage' ») et sortir MTP en non-zéro. Un projet qui n'exécute
      #      aucun test échoue également, ET écrit quand même son rapport. Dans les deux cas le
      #      `set -euo pipefail` de l'étape précédente arrête le job AVANT cette garde — il n'y a
      #      pas d'union partielle à rattraper ici.
      #
      #   2. `$mtp` SUR-COMPTE. Son grep matche tout csproj citant xunit.v3, y compris une
      #      bibliothèque d'aide partagée (FactAttribute maison, fixtures communes) qui n'est pas
      #      une application de test et que `dotnet test` n'exécute donc jamais. Mesuré : 1 projet
      #      de test + 1 bibliothèque d'aide = run vert, 1 rapport écrit, `$mtp` en annonce 2. Le
      #      compte refuserait un dépôt parfaitement sain. `>=` n'y change rien : le défaut est
      #      dans la SOURCE du nombre attendu, pas dans la comparaison.
      #
      #   Compter juste supposerait de ne retenir que les vraies applications de test, ce qui
      #   demande MSBuild (`IsTestProject`) — la découverte de projets en shell que #17 avait
      #   écartée. Resserrer ceci en compte est donc une RÉGRESSION tant que ces deux points
      #   tiennent, et les DEUX sont épinglés dans tests/xunit-v3/test.sh — le point 1 par les cas
      #   4f et 4g, le point 2 par le cas 4h, qui relit la ligne `mtp=$(grep …)` ci-dessus dans ce
      #   fichier plutôt que de la recopier. Resserrer ce grep fait donc échouer 4h : c'est là que
      #   la modification se verra si l'un des deux points cesse d'être vrai.
      - name: Garde — la couverture a bien été produite
        run: |
          if ! find coverage -name '*.cobertura.xml' | grep -q . ; then
            echo "Aucun rapport de couverture produit — la collecte a été ignorée en silence."
            echo "Projet MTP sans Microsoft.Testing.Extensions.CodeCoverage ? Voir"
            echo "legacy-upgrade/references/xunit-v3-migration.md."
            exit 1
          fi

      # Une condition EXPLICITE, pas la condition implicite `success()` — et c'est ce qui rend
      # l'artefact utile (#74). L'étape de test tourne sous `set -euo pipefail` : un hôte de test
      # qui sort en non-zéro termine le job ICI, et toutes les étapes suivantes sont SAUTÉES. Sans
      # cette ligne, l'artefact n'était donc publié que sur les runs où rien n'avait échoué —
      # exactement ceux où personne n'en a besoin. Mesuré : un projet de test sans
      # Microsoft.Testing.Extensions.CodeCoverage fait refuser `--coverage`, le job s'arrête là, et
      # le log qui porte la RAISON ne quitte jamais le runner.
      #
      # Le choix de la condition, entre les trois qui « tournent après un échec » :
      #   • `failure()` seul est FAUX ici : il cesserait de publier la couverture sur les runs
      #     verts, remplaçant ce trou-ci par son symétrique — et c'est le chemin vert qui alimente
      #     le tableau de bord.
      #   • `always()` marche, mais il est vrai AUSSI quand le job est annulé : un run long qu'on
      #     interrompt exécute encore l'upload avant de rendre la main.
      #   • `!cancelled()` couvre l'échec sans couvrir l'annulation. C'est ce que recommande la
      #     doc GitHub, et c'est ce qu'on prend.
      # `${{ }}` est nécessaire : en YAML nu, `!` ouvre un tag et la valeur ne se parse pas.
      - name: Publier la couverture en artefact de build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          # Le nom du fichier n'est plus fixe — c'est ce qui empêche deux projets de test de
          # s'écraser — donc le glob prend *.cobertura.xml. VSTest niche un fichier par projet
          # sous un dossier GUID, MTP les écrit à plat : `**` couvre en principe les deux (il
          # matche zéro segment ou plus), le second motif est une ceinture-bretelles assumée,
          # pas une nécessité mesurée.
          # Les .log sont ceux que MTP écrit à côté, un par projet : ils portent le détail des
          # assertions, seule chose qui rende diagnosticable un test qui n'échoue que sur le
          # runner. Ils n'arrivaient pas jusqu'ici tant que MTP les écrivait sous bin/.
          # ⚠ TOUS les motifs de CET artefact restent sous coverage/, et ce n'est pas cosmétique :
          #   actions/upload-artifact enracine l'archive au PLUS PETIT ANCÊTRE COMMUN des fichiers
          #   trouvés. Tant que tout est sous coverage/, les rapports arrivent à plat
          #   (`X.cobertura.xml`). Qu'un seul motif matche hors de coverage/ et la racine devient
          #   l'espace de travail : les MÊMES rapports deviennent `coverage/X.cobertura.xml`, et un
          #   job qui télécharge cet artefact pour lancer `reportgenerator -reports:*.cobertura.xml`
          #   ne trouve plus rien. Pire, le changement serait CONDITIONNEL — il dépendrait de
          #   l'existence d'un log hors coverage/, donc la forme de l'artefact varierait d'un run à
          #   l'autre. Les logs restés sous bin/ partent donc dans un artefact SÉPARÉ, juste après.
          #
          # ⚠ ENCODAGE : MTP écrit ces .log en UTF-16-LE AVEC BOM (mesuré : premiers octets
          #   `ff fe`), les deux emplacements confondus. Conséquence pratique une fois l'artefact
          #   téléchargé : `grep "Unknown option" <log>` ne renvoie RIEN — non pas parce que le
          #   fichier est vide, mais parce qu'un lecteur UTF-8 n'y voit pas de texte. Le piège est
          #   qu'il en donne l'apparence, et l'on conclut que le log ne dit rien. Décoder d'abord :
          #     iconv -f UTF-16 -t UTF-8 <log>        # ou, en Python, open(p, encoding="utf-16")
          #   Ne pas deviner l'encodage par essais successifs : `raw.decode("utf-16")` NE lève PAS
          #   sur de l'UTF-8 de longueur paire, il rend du mojibake — se fier au BOM.
          path: |
            coverage/**/*.cobertura.xml
            coverage/*.cobertura.xml
            coverage/**/*.log

      # L'autre emplacement, dans son PROPRE artefact (#74). C'est `--results-directory` qui met
      # les logs MTP sous coverage/ — mais il voyage dans la même liste d'arguments que
      # `--coverage`, donc un projet sans Microsoft.Testing.Extensions.CodeCoverage se voit refuser
      # LES DEUX, et son log retombe sous `<projet>/bin/<config>/<tfm>/TestResults/`. C'est
      # précisément le cas où ce log est la SEULE explication de l'échec, et où la console n'en
      # imprime que le chemin.
      # Séparé, et non ajouté à l'artefact ci-dessus, pour ne pas déplacer sa racine (voir la note
      # sur le plus petit ancêtre commun). `failure()` suffit ici : sur un run vert, ce chemin de
      # repli est vide par construction. `if-no-files-found: ignore` parce qu'un échec ordinaire
      # (un test qui casse) laisse ses logs sous coverage/ et rien ici — l'absence est le cas
      # NORMAL, pas un incident à signaler.
      # Le motif est ancré sur `*/bin/*` pour la même raison que le nettoyage plus haut : ne jamais
      # ramasser un TestResults/ que le dépôt aurait committé dans ses sources.
      # Ces logs sont UTF-16-LE, comme ceux de l'artefact précédent — voir la note d'encodage.
      - name: Publier les logs MTP restés sous bin/ (diagnostic d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mtp-logs-bin-fallback
          path: '**/bin/**/TestResults/*.log'
          if-no-files-found: ignore

      # À N'ACTIVER que si ce dépôt COMMITTE un bundle front — un `dist/` suivi par git — que le
      # build .NET consomme (EmbeddedResource, Content, ou contenu statique servi tel quel).
      # Livré INERTE par défaut sur une mesure, pas par prudence : sur 193 dépôts .NET, 3
      # committent une sortie de build et UN SEUL la fait consommer par le build (issue #32). Une
      # étape rouge par défaut sur les 192 dépôts où la garde n'a rien à mesurer finirait
      # supprimée ou en `continue-on-error`, ce qui apprend à l'équipe à ignorer une étape rouge —
      # pire qu'une étape absente.
      #
      # Le motif, mesuré sur Ninjadog : `dist/` est committé et AUCUNE cible MSBuild n'appelle
      # npm. Un bump de la dépendance JS vulnérable change donc le lockfile et pas un octet du
      # binaire livré — pendant que la PR se ferme et que le Dependency Dashboard affiche la
      # faille comme réglée. C'est une FAUSSE REMÉDIATION, strictement pire que ne rien faire.
      #
      # Deux préconditions avant d'activer, les deux mesurées :
      #
      #  1. `git status --porcelain`, JAMAIS `git diff` — parce que `--porcelain` couvre les
      #     fichiers NON SUIVIS, et que c'est là qu'un bundle régénéré atterrit. Les bundlers
      #     nomment leurs assets par hash de contenu, ce qui donne deux formes de dérive :
      #       • le RENOMMAGE (l'ancien fichier disparaît, un autre apparaît non suivi) —
      #         `git diff` en voit bien la moitié, la suppression, mais ne nomme jamais le
      #         remplaçant : impossible de distinguer « le build a perdu un fichier » de
      #         « le build a produit un autre bundle » ;
      #       • l'AJOUT PUR (un nouveau chunk, un asset fraîchement importé, pendant que les
      #         fichiers existants gardent nom et contenu) — là `git diff` rend l'arbre
      #         PROPRE, et une garde fondée dessus passe au vert sur un bundle périmé.
      #     C'est le second cas qui rend `--porcelain` obligatoire et non simplement préférable.
      #     Les deux sont exécutés dans `tests/ci-template/test.sh` : ce commentaire décrit une
      #     mesure, il n'en tient pas lieu.
      #
      #  2. Le build doit être reproductible DANS L'ENVIRONNEMENT DE LA CI. Deux reconstructions
      #     propres du même commit donnent bien un résultat identique à l'octet — mais les
      #     chaînes front modernes embarquent des binaires natifs PAR PLATEFORME
      #     (`@tailwindcss/oxide`, `lightningcss`, `esbuild`…), et le CSS émis par le binaire
      #     macOS diffère de celui du binaire Linux à sources et lockfile identiques. Mesuré, à
      #     cause de cette étape même. Donc : épinglez `runs-on:` ET la version exacte de Node,
      #     et régénérez le bundle committé depuis cette plateforme-là. Sinon la garde rougit sur
      #     un bundle parfaitement correct, et vous aurez construit le faux rouge que le point
      #     précédent cherche à éviter.
      #
      #     Les trois étapes ci-dessous sont donc LIVE, et inertes par défaut : elles ne
      #     s'exécutent que si les variables de dépôt sont renseignées. Sur les 190 dépôts sur 193
      #     qui ne committent aucune sortie de build — 192 si l'on compte ceux dont le build .NET
      #     ne la consomme pas — elles apparaissent « skipped » et ne font rien. Les deux
      #     dénominateurs répondent à deux questions différentes ; ne pas les confondre.
      #     C'est un choix mesuré (#70) : en commentaire, une référence d'action est
      #     INVISIBLE au manager github-actions de Renovate — vérifié en exécutant son propre
      #     extracteur sur ce fichier, 5 dépendances extraites et `setup-node` absent. En clair,
      #     il en voit 7, dont `actions/setup-node` ET `node 26.5.0` lui-même. C'est ce second
      #     point qui rend la garde saine : la précondition 2 exige un Node épinglé à l'exact, et
      #     ainsi c'est Renovate qui le maintient au lieu d'un commentaire qui vieillit — la
      #     facture déjà payée en #35, où les workflows LIVRÉS avaient trois majeures de retard.
      #
      # POUR ACTIVER — deux variables de dépôt (Settings → Secrets and variables → Actions →
      # Variables), et rien à éditer dans ce fichier :
      #
      #     BUNDLE_SRC   le répertoire qui porte package.json   ex. src/App/WebUI
      #     BUNDLE_DIST  le bundle committé, sous BUNDLE_SRC    ex. src/App/WebUI/dist
      #
      # Deux, et pas une seule, parce que le chemin de sortie n'est pas déductible de l'entrée
      # (`dist`, `build`, `wwwroot/dist`…). Mais deux réglages indépendants seraient pires qu'un :
      # s'ils désignaient des arbres différents, npm reconstruirait l'un pendant que la garde
      # examine l'autre, elle ne verrait aucune dérive, et l'étape passerait au VERT sur un bundle
      # périmé — la fausse remédiation même que tout ceci existe pour empêcher, produite par la
      # garde. La garde vérifie donc que `BUNDLE_DIST` est bien SOUS `BUNDLE_SRC` et refuse sinon.
      #
      # ⚠ La précondition 2 demande d'épingler la plateforme ENTIÈRE, pas seulement Node : ce
      # modèle tourne sur `runs-on: ubuntu-latest`, qui FLOTTE. Le jour où GitHub bascule l'image,
      # le binaire natif change, le bundle reconstruit diffère, et la garde rougit sur un bundle
      # correct. Si vous activez ceci, épinglez aussi `runs-on:` sur une image datée
      # (`ubuntu-24.04`) et régénérez le bundle committé depuis cette image-là.
      #
      # ⚠ Renovate proposera des bumps de `node-version` — c'est le but, la ligne est managée.
      # Mais un changement de majeure de Node change l'ABI des modules natifs, donc la sortie du
      # bundler : la PR de bump SEULE fera rougir la garde, avec un message qui accuse un bundle
      # périmé alors que c'est la chaîne d'outils qui a bougé. Reconstruisez et committez le
      # bundle DANS la même PR que le bump.
      #
      # Pour désactiver : supprimez les variables — le code reste en place, sous test, inerte.
      - name: Setup Node (bundle front committé)
        if: ${{ vars.BUNDLE_DIST != '' }}
        uses: actions/setup-node@v5
        with:
          # Version EXACTE, jamais `26.x` ni `26.5.x` : la précondition 2 tombe si Node flotte,
          # et `tests/ci-template/test.sh` refuse toute forme non `N.N.N`.
          # Renovate maintient cette ligne — elle est extraite comme dépendance `node`.
          node-version: 26.5.0

      - name: Reconstruire le bundle front committé
        if: ${{ vars.BUNDLE_DIST != '' }}
        working-directory: ${{ vars.BUNDLE_SRC }}
        run: |
          npm ci
          npm run build

      - name: Garde — le bundle front committé correspond toujours à ses sources
        if: ${{ vars.BUNDLE_DIST != '' }}
        env:
          BUNDLE_DIST: ${{ vars.BUNDLE_DIST }}
          BUNDLE_SRC: ${{ vars.BUNDLE_SRC }}
        run: |
          # Les deux variables doivent désigner le MÊME arbre. Si `BUNDLE_SRC` pointe ailleurs,
          # l'étape précédente a reconstruit un autre répertoire, celui-ci n'a pas bougé, et la
          # garde certifierait « à jour » un bundle que rien n'a régénéré.
          if [ -z "${BUNDLE_SRC:-}" ]; then
            echo "::error::BUNDLE_SRC n'est pas renseignée alors que BUNDLE_DIST l'est."
            echo "La reconstruction n'a donc pas eu lieu là où vit le bundle."
            exit 1
          fi
          case "$BUNDLE_DIST/" in
            "$BUNDLE_SRC"/*) : ;;
            *) echo "::error::BUNDLE_DIST ('$BUNDLE_DIST') n'est pas sous BUNDLE_SRC ('$BUNDLE_SRC')."
               echo "npm a reconstruit '$BUNDLE_SRC' pendant que la garde examine '$BUNDLE_DIST' :"
               echo "elle ne verrait aucune dérive et passerait au vert sur un bundle périmé."
               exit 1 ;;
          esac
          # D'ABORD prouver que la garde mesure quelque chose. `git status --porcelain -- <chemin
          # inexistant>` sort en 0 avec une sortie VIDE : un chemin mal renseigné, ou un répertoire
          # renommé six mois plus tard, donnerait donc une étape verte à chaque run qui ne vérifie
          # plus rien — « ça a l'air entretenu, ça ne mesure rien », exactement le défaut que cette
          # étape existe pour empêcher, reproduit dans l'étape elle-même. Le vert est ici la
          # couleur attendue, donc rien ne le signalerait jamais.
          if [ -z "${BUNDLE_DIST:-}" ] || [ ! -d "$BUNDLE_DIST" ]; then
            echo "::error::BUNDLE_DIST ('${BUNDLE_DIST:-}') n'est pas un répertoire de ce dépôt."
            echo "Corrigez la variable de dépôt, ou supprimez-la pour désactiver la garde."
            exit 1
          fi
          if ! git ls-files --error-unmatch -- "$BUNDLE_DIST" > /dev/null 2>&1; then
            echo "::error::$BUNDLE_DIST n'est suivi par git pour aucun fichier."
            echo "Cette garde ne vaut que pour un bundle COMMITTÉ : sans fichier suivi, elle"
            echo "resterait verte sans rien mesurer."
            exit 1
          fi
          # `--ignored` est OBLIGATOIRE, pas un extra. La façon normale de committer une sortie de
          # build est de mettre `dist/` dans .gitignore puis de forcer l'ajout (`git add -f`). Dans
          # ce dépôt-là, un nouveau chunk n'est pas seulement non suivi : il est IGNORÉ, et
          # `--porcelain` seul omet les fichiers ignorés — il n'affiche rien, et la garde annonce
          # « à jour » sur un bundle périmé. Mesuré. Contrepartie assumée : si le bundler écrit un
          # cache ignoré DANS ce répertoire, il sera signalé — faites pointer BUNDLE_DIST sur la
          # sortie livrée, pas sur un dossier qui contient aussi du cache.
          changes=$(git status --porcelain --ignored -- "$BUNDLE_DIST")
          if [ -n "$changes" ]; then
            echo "::error::$BUNDLE_DIST est périmé : il ne correspond plus à ses sources."
            echo "Le binaire livré embarque encore l'ancien bundle — un bump de dépendance JS"
            echo "ne l'a donc PAS corrigé, il a seulement fermé la PR."
            echo "Correctif : reconstruire le bundle, puis committer le résultat."
            echo "$changes"
            exit 1
          fi
          echo "$BUNDLE_DIST est à jour."
